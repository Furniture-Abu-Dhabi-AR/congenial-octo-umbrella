<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AR Android + iPhone</title>

<script type="module">

/* ======= Путь к GLB ======= */
const MODEL_URL = 'model.glb';

/* ======= Импорт Three.js ======= */
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

/* ======= Страница ======= */
document.body.style.margin = '0';
document.body.style.fontFamily = 'system-ui, Roboto, Arial';
const container = document.createElement('div');
document.body.appendChild(container);

/* ======= Renderer ======= */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
container.appendChild(renderer.domElement);

/* ======= Сцена ======= */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

/* ======= Свет ======= */
const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
scene.add(light);

/* ======= Загрузка модели ======= */
const loader = new GLTFLoader();
let model;

loader.load(MODEL_URL, gltf => {
    model = gltf.scene;
    model.scale.set(1, 1, 1);
});

/* ======= AR-кнопка ======= */
const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
document.body.appendChild(arButton);

/* ======= Hit-test ======= */
let hitTestSource = null;
let hitTestSourceRequested = false;

renderer.setAnimationLoop((timestamp, frame) => {
    if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
            session.requestReferenceSpace('viewer').then(space => {
                session.requestHitTestSource({ space }).then(source => {
                    hitTestSource = source;
                });
            });
            hitTestSourceRequested = true;
        }

        const pose = frame.getViewerPose(referenceSpace);

        if (pose && hitTestSource) {
            const hit = frame.getHitTestResults(hitTestSource)[0];
            if (hit && model && !scene.children.includes(model)) {
                const pos = hit.getPose(referenceSpace).transform.position;
                model.position.set(pos.x, pos.y, pos.z);
                scene.add(model);
            }
        }
    }

    renderer.render(scene, camera);
});
</script>

<!-- ======= Кнопки Android + iPhone ======= -->
<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 999;">
  <button onclick="startAndroidAR()" 
          style="padding: 15px 25px; font-size: 18px; border-radius: 10px; margin-right: 10px;">
    AR для Android
  </button>

  <a rel="ar" href="model.usdz">
    <button style="padding: 15px 25px; font-size: 18px; border-radius: 10px;">
      AR для iPhone
    </button>
  </a>
</div>

<script>
function startAndroidAR() {
  const arButton = document.querySelector("button[style*='ARButton']");
  if (arButton) arButton.click();
}
</script>

</body>
</html>
