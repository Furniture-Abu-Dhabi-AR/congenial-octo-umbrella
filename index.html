<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AR + HitTest + Joystick</title>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

/* === ПУТЬ К МОДЕЛИ === */
const MODEL_URL = "model.glb";

/* === Renderer === */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

/* === Scene === */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera();

const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
scene.add(light);

/* === Reticle === */
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.08, 0.12, 32).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({ color: 0x00ffcc })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

/* === Groups === */
const anchorGroup = new THREE.Group();
const offsetGroup = new THREE.Group();
anchorGroup.add(offsetGroup);
scene.add(anchorGroup);

/* === Load model === */
let model = null;
const loader = new GLTFLoader();
loader.load(MODEL_URL, (gltf) => {
  model = gltf.scene;
  model.scale.set(1,1,1);
  offsetGroup.add(model);
});

/* === Joystick === */
const joystick = document.createElement("div");
joystick.style.position = "absolute";
joystick.style.left = "20px";
joystick.style.bottom = "20px";
joystick.style.width = "120px";
joystick.style.height = "120px";
joystick.style.borderRadius = "12px";
joystick.style.background = "rgba(255,255,255,0.05)";
joystick.style.zIndex = "10";
document.body.appendChild(joystick);

const knob = document.createElement("div");
knob.style.width = "50px";
knob.style.height = "50px";
knob.style.borderRadius = "50%";
knob.style.background = "rgba(255,255,255,0.2)";
knob.style.margin = "35px";
joystick.appendChild(knob);

let joy = {x:0, y:0};
let active = false;
let start = {x:0, y:0};

joystick.addEventListener("pointerdown", e => {
  active = true;
  start.x = e.clientX;
  start.y = e.clientY;
});
window.addEventListener("pointermove", e => {
  if (!active) return;
  const dx = e.clientX - start.x;
  const dy = e.clientY - start.y;
  joy.x = Math.max(-1, Math.min(1, dx / 40));
  joy.y = Math.max(-1, Math.min(1, dy / 40));
  knob.style.transform = `translate(${joy.x*30}px, ${joy.y*30}px)`;
});
window.addEventListener("pointerup", () => {
  active = false;
  joy.x = 0; joy.y = 0;
  knob.style.transform = "translate(0,0)";
});

/* === AR Button === */
document.body.appendChild(ARButton.createButton(renderer, {
  requiredFeatures: ['hit-test', 'local-floor']
}));

/* === WebXR === */
let hitTestSource = null;
let refSpace = null;
let placed = false;

renderer.xr.addEventListener("sessionstart", async () => {
  const session = renderer.xr.getSession();
  refSpace = await session.requestReferenceSpace("local-floor");
  const viewer = await session.requestReferenceSpace("viewer");
  hitTestSource = await session.requestHitTestSource({ space: viewer });

  session.addEventListener("select", () => {
    if (!reticle.visible) return;
    const m = new THREE.Matrix4().fromArray(reticle.matrix.elements);
    const pos = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    const scl = new THREE.Vector3();
    m.decompose(pos, quat, scl);
    anchorGroup.position.copy(pos);
    anchorGroup.quaternion.copy(quat);
    placed = true;
  });
});

/* === Render loop === */
renderer.setAnimationLoop((t, frame) => {
  if (frame) {
    const pose = frame.getViewerPose(refSpace);
    if (hitTestSource && pose && !placed) {
      const hits = frame.getHitTestResults(hitTestSource);
      if (hits.length > 0) {
        const hit = hits[0].getPose(refSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(hit.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }

    if (placed && model) {
      offsetGroup.position.x += joy.x * 0.02;
      offsetGroup.position.z -= joy.y * 0.02;
    }
  }

  renderer.render(scene, camera);
});
</script>

<style>
body { margin:0; overflow:hidden; background:#000; }
</style>
</head>
<body></body>
</html>
